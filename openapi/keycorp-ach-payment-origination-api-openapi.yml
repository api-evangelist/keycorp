components:
  schemas:
    batchResponseEnvelopeAccepted:
      required:
      - batch
      type: object
      description: Contains information for a successful ACH transaction.
      properties:
        batch:
          $ref: '#/components/schemas/acceptedBatchResponseAcceptedDetailResponse'
    addendaResponse:
      type: object
      description: Contains status and additional information about the returned addenda records.
      properties:
        status:
          type: string
          description: The overall status of the addenda request can be accepted or rejected.
          example: accepted
        errorMessages:
          type: array
          description: List of error messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        informationMessages:
          type: array
          description: List of informational messages.
          items:
            $ref: '#/components/schemas/detailMessage'
    cCDDetailRequest:
      required:
      - DFIAccountNumber
      - accountType
      - amount
      - checkDigit
      - creditDebitCode
      - receivingCompanyName
      - receivingDFIId
      - transactionType
      - uuid
      type: object
      description: Parameters for additional details about the CCD request.
      properties:
        uuid:
          type: string
          description: A custom value used to identify each transaction. It is required to undo a payment. The ID must not exceed 45 alphanumeric characters.
          maxLength: 45
          example: qas220517x-49eb-47664-b94rhd1-e52e2re13001
        accountType:
          type: string
          description: 'The account type can be checking (C) or savings (S). Valid values: C, S.'
          enum:
          - C
          - S
        creditDebitCode:
          type: string
          description: 'One-character field indicates if the ACH transaction is a credit (C) or debit (D). Valid values: C, D.'
          enum:
          - C
          - D
        transactionType:
          type: string
          description: 'Nacha-defined transaction types can be live (L), prenote (P), or zero (Z). Valid values: L, P, Z.'
          enum:
          - L
          - P
          - Z
        receivingDFIId:
          type: string
          description: The bank routing number (ABA number) of the receiving designated financial institution. The number can be a maximum of 8 digits.
          maxLength: 8
        checkDigit:
          type: string
          description: The final character of a routing number that can be used to validate a specific routing number. This is a single digit.
          maxLength: 1
        DFIAccountNumber:
          type: string
          description: The recipient account number at the designated financial institution. The account number can be a maximum of 17 characters.
          maxLength: 17
        amount:
          type: string
          description: The transaction amount in valid currency format. The amount can have up to 8 digits before the decimal and 2 digits after the decimal.
          maxLength: 11
        identificationNumber:
          type: string
          description: Identification number for the detail record. The number cannot exceed 15 characters.
          maxLength: 15
        receivingCompanyName:
          type: string
          description: The name of the receiving company. The name cannot exceed a maximum of 22 characters.
          maxLength: 22
        discretionaryData:
          type: string
          description: Further identification of the company or used to describe the type of entries being processed. The ID can be a maximum of 2 characters.
          maxLength: 2
        addenda:
          type: array
          maxItems: 1
          description: List of addenda records.
          items:
            $ref: '#/components/schemas/baseAddendaRequest'
      example:
        DFIAccountNumber: '123456789'
        accountType: C
        amount: '0.01'
        checkDigit: '9'
        creditDebitCode: C
        receivingCompanyName: ProdTest001
        receivingDFIId: '04100103'
        transactionType: L
        uuid: qas220517x-49eb-47664-b94rhd1-e52e2re11001
        identificationNumber: 517220101A
        discretionaryData: AB
    addendaRequest:
      required:
      - addendaSequenceNumber
      - paymentRelatedInformation
      type: object
      description: Contains related payment information and the addenda record sequence number.
      properties:
        paymentRelatedInformation:
          type: string
          description: The related payment information for the addenda records. The limit is 80 characters.
          maxLength: 80
          example:
            paymentRelatedInformation: 0410*820412***PER*AP*DAN HAMPTONE*IT*N1*PR*THE COMPANY    OF PUERTO RICO*         0
        addendaSequenceNumber:
          type: string
          description: The sequence number of the addenda. The number cannot exceed 4 digits.
          example: '003'
    acceptedBatchResponseAcceptedDetailResponse:
      required:
      - uuid
      - status
      type: object
      description: Contains response details for accepted ACH transactions.
      properties:
        uuid:
          type: string
          description: A custom value used to identify each transaction. It is required to undo a payment. The ID must not exceed 45 alphanumeric characters.
          maxLength: 45
          example: qas220517x-49eb-47664-b94rhd1-e52e2re13001
        status:
          type: string
          description: The status of the batch can be accepted or rejected.
          example: accepted
        requestAcceptedUTCTime:
          type: string
          description: 'The date and time the request was accepted in UTC time. Format: YYYY-MM-DDTHH:MM:SSZ'
          example: '2022-05-25T16:33:46Z'
        effectiveDate:
          type: string
          description: 'The date the transaction is posted. This date must be within 31 days of the current date. Format: YYMMDD'
          example: '220411'
        informationMessages:
          type: array
          description: List of informational messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        errorMessages:
          type: array
          description: List of error messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        details:
          type: array
          description: Details for the ACH transaction by UUID.
          items:
            $ref: '#/components/schemas/acceptedDetailResponse'
    batchRequestCTXDetailRequest:
      required:
      - collectionApplicationId
      - point
      - secCode
      - uuid
      - companyEntryDescription
      type: object
      description: Contains batch request details for a CTX transaction.
      properties:
        uuid:
          type: string
          description: A custom value used to identify each transaction. It is required to undo a payment. The ID must not exceed 45 alphanumeric characters.
          maxLength: 45
          example: qas220517x-49eb-47664-b94rhd1-e52e2re13001
        point:
          type: string
          description: A short name specific to your company provided by KeyBank. This is included in the file name and improves security  for file transfers.
          maxLength: 9
        collectionApplicationId:
          type: string
          description: This ID is provided by KeyBank and cannot exceed the maximum of 9 alphanumeric characters.
          maxLength: 9
        collectionApplicationType:
          type: string
          description: A subset of the collection application parameters. This is not commonly used and by default, left blank. If there is a collection application type, the value is provided by KeyBank during onboarding and cannot exceed 6 characters.
          maxLength: 6
        secCode:
          type: string
          description: 'The three-digit Standard Entry Class code based on Nacha rules. Valid values: CCD, CTX, PPD, TEL, WEB.'
          maxLength: 3
        effectiveDate:
          type: string
          description: 'The date the transaction is posted. This date must be within 31 days of the current date. Format: YYMMDD'
          maxLength: 6
        companyDescriptiveDate:
          type: string
          description: 'Company descriptive date. Format: YYMMDD'
        companyEntryDescription:
          type: string
          description: 'Provides the receiver a description of the payment purpose. The value cannot exceed 10 characters and cannot be blank. Possible values: ''REVERSAL'', ''RETURN FEE'', ''RECLAIM'', ''REDEPCHECK'' for RCK entries, ''HCCLAIMPMT'' for Health Care EFTs, or ''ACCTVERIFY'' for clients sending in a micro-entry as a type of ACH entry.'
        details:
          type: array
          description: List of detail records.
          items:
            $ref: '#/components/schemas/cTXDetailRequest'
      example:
        collectionApplicationId: TESTING
        point: APITEST
        secCode: CCD
        uuid: qas22517-4d3338-4c6f-bcd6fehdd0-11000
        collectionApplicationType: ''
        effectiveDate: '220725'
        companyDescriptiveDate: '220725'
        companyEntryDescription: Payroll
        details:
          DFIAccountNumber: '123456789'
          accountType: C
          amount: '0.01'
          checkDigit: '9'
          creditDebitCode: C
          receivingCompanyName: ProdTest001
          receivingDFIId: '04100103'
          transactionType: L
          uuid: qas220517x-49eb-47664-b94rhd1-e52e2re11001
          identificationNumber: 099999999a
          discretionaryData: AB
