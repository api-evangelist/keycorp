        '404':
          description: No Wire transaction was found with the provided transactionId
          headers:
            X-CorrelationId:
              description: >-
                A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
              example:
                ErrorMessage: Error received from backend service
                TransactionId: 84293235-5d2c-42ba-afc3-a5d4afc5f88e27097
