specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: KeyCorp
providerId: keycorp
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Banking
  - Commercial Banking
  - Financial Services
description: KeyCorp does not publish API rate limits or throttling thresholds publicly. Limits are likely
  applied per-application/per-mTLS-client and surfaced only to onboarded commercial-banking customers
  through the developer portal documentation behind authentication.
sources:
  - https://developer.key.com/
notes: No public rate-limit documentation found on developer.key.com. Reconcile from gated docs once
  an authenticated portal session is available.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: API throttling
    scope: client
    metric: varies
    limit: 'see authenticated KeyBank developer portal documentation'
policies:
  - name: Backoff
    description: Implement exponential backoff with jitter and honor any Retry-After header surfaced by
      the gateway.
  - name: Idempotency
    description: For payments-origination endpoints (ACH, Wire, RTP), use unique idempotency tokens per
      payment to make safe retries possible.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
