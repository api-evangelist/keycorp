description: KeyCorp (KeyBank) does not publish public API pricing. Their developer portal at developer.key.com
  exposes APIs to commercial-banking customers; access and any associated fees are negotiated as part
  of the underlying treasury-services contract. No tier/plan structure is published.
sources:
  - https://developer.key.com/
notes: No public pricing available. KeyBank API access is gated behind a commercial-banking relationship;
  fees are part of the treasury / cash-management agreement rather than a published API tariff. Reconcile
  by surveying actual customer agreements when available.
plans:
  - id: keycorp-commercial-banking
    name: Commercial Banking Customer
    type: enterprise
    description: API access requires an existing KeyBank commercial-banking relationship. Pricing is contract-negotiated
      under the treasury / cash-management agreement; not published.
    entries:
      - label: Contract-negotiated
        name: contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: KeyBank Account Information API
      - name: KeyBank ACH Origination API
      - name: KeyBank Wire Transfer API
      - name: KeyBank RTP Send Payment API
      - name: KeyBank Account Validation API
      - name: KeyBank Previous Day API
      - name: KeyBank Intraday API
      - name: KeyBank Check Services API
      - name: KeyBank Webhooks
