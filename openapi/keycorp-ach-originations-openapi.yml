components:
#---------------------------------------------------
# Data Definitions
#---------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:    
    healthResponse:
      type: object
      title: healthResponse
      description: The response for a successful API health check.
      properties:
        Status:
          type: string
          description: The status of the health check response.
        Source:
          type: string
          description: The origin of the system response can be 'Gateway' or 'Roundtrip'. Roundtrip returns a response from the farthest system involved.
        Timestamp:
          type: string
          description: The date (YYYY-MM-DD) and time (HH:MM:SS) of response from the API service.
        ClientIp:
          type: string
          description: The client IP address the gateway receives from the request.
        X-Forwarded-For:
          type: string
          description: The sequence of the IP addresses for systems between the client and the gateway.
    exception:
      type: object
      title: ExceptionSchema
      properties:
        ErrorMessage: 
          type: string
          description: Error message related to system generating this error.
        TransactionId:
          type: string
          description: Unique functional identifier from the data to identify a message.
        X-CorrelationId:
          type: string
          description: A unique identifier generated for each transaction that remains with the transaction through the chain of API operations.
        TransactionTime:
          type: string
          description: Time of the occurrence of the error of the message.
        Api-Url: 
          type: string
          description: The API URL path of the call that generated the response. 
        ServiceError:
          type: object
          title: ServiceError
          description: Indicates the service error details, if available.
          oneOf:
            - $ref: '#/components/schemas/detailMessage'
            - $ref: '#/components/schemas/connectError'
    connectError:
      type: object
      properties:
        ConnectError:
          type: string
          description: Error information of the connectivity with downstream service.
    acceptedAddendaResponseEnvelope:
      type: object
      description: Contains the response payload for the submitted request.
      properties:
        uuid:
          type: string
          description: A custom value used to identify each transaction. It is required to undo a payment. The ID must not exceed 45 alphanumeric characters.
          maxLength: 45
          example: 'qas220517x-49eb-47664-b94rhd1-e52e2re13001'
        status:
          type: string
          description: The overall status of the addenda request can be accepted or rejected.
          example: 'accepted'
        traceNumber:
          type: string
          description: The unique number for the ACH transaction. Record this number for possible ACH inquiry requests.
          example: '41001030008011'
        informationMessages:
          type: array
          description: List of informational messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        errorMessages:
          type: array
          description: List of error messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        addenda:
          type: array
          description: List of addenda records.
          items:
            $ref: '#/components/schemas/addendaResponse'
        requestAcceptedUTCTime:
          type: string
          description: 'The date and time the request was accepted in UTC time. Format: YYYY-MM-DDTHH:MM:SSZ'
          example: '2022-05-25T16:33:46Z'
    acceptedBatchResponseAcceptedDetailResponse:
      required:
        - uuid
        - status
      type: object
      description: Contains response details for accepted ACH transactions.
      properties:
        uuid:
          type: string
          description: A custom value used to identify each transaction. It is required to undo a payment. The ID must not exceed 45 alphanumeric characters.
          maxLength: 45
          example: 'qas220517x-49eb-47664-b94rhd1-e52e2re13001'
        status:
          type: string
          description: The status of the batch can be accepted or rejected.
          example: 'accepted'
        requestAcceptedUTCTime:
          type: string
          description: 'The date and time the request was accepted in UTC time. Format: YYYY-MM-DDTHH:MM:SSZ'
          example: '2022-05-25T16:33:46Z'
        effectiveDate:
          type: string
          description: 'The date the transaction is posted. This date must be within 31 days of the current date. Format: YYMMDD'
          example: '220411'
        informationMessages:
          type: array
          description: List of informational messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        errorMessages:
          type: array
          description: List of error messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        details:
          type: array
          description: Details for the ACH transaction by UUID.
          items:
            $ref: '#/components/schemas/acceptedDetailResponse'
    acceptedDetailResponse:
      required:
        - uuid
      type: object
      description: Contains the details for an accepted response.
      properties:
        uuid:
          type: string
          description: A custom value used to identify each transaction. It is required to undo a payment. The ID must not exceed 45 alphanumeric characters.
          maxLength: 45
          example: 'qas220517x-49eb-47664-b94rhd1-e52e2re13001'
        status:
          type: string
          description: The overall status of the addenda can be accepted or rejected.
        errorMessages:
          type: array
          description: List of error messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        informationMessages:
          type: array
          description: List of informational messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        traceNumber:
          type: string
          description: The unique number for the ACH transaction. Record this number for possible ACH inquiry requests. 
          example: '41001030009002'
        requestAcceptedUTCTime:
          type: string
          description: 'The date and time the request was accepted in UTC time. Format: YYYY-MM-DDTHH:MM:SSZ'
          example: '2022-05-25T16:33:46Z'
    addendaRequest:
      required:
      - addendaSequenceNumber
      - paymentRelatedInformation
      type: object
      description: Contains related payment information and the addenda record sequence number. 
      properties:
        paymentRelatedInformation:
          type: string
          description: The related payment information for the addenda records. The limit is 80 characters.
          maxLength: 80
          example:
            paymentRelatedInformation: '0410*820412***PER*AP*DAN HAMPTONE*IT*N1*PR*THE COMPANY    OF PUERTO RICO*         0'            
        addendaSequenceNumber:
          type: string
          description: The sequence number of the addenda. The number cannot exceed 4 digits.  
          example:  '003'    
    addendaRequestEnvelope:
      required:
      - addenda
      - uuid
      type: object
      description: Contains the parameters to request a list of addenda records by the UUID.
      properties:
        addenda:
          type: array
          description: List of addenda records.
          items:
            $ref: '#/components/schemas/addendaRequest'
        uuid:
          type: string
          description: A custom value used to identify each transaction. It is required to undo a payment. The ID must not exceed 45 alphanumeric characters. 
          maxLength: 45
          example: 'qas220517x-49eb-47664-b94rhd1-e52e2re13001'
    addendaResponse:
      type: object
      description: Contains status and additional information about the returned addenda records.
      properties:
        status:
          type: string
          description: The overall status of the addenda request can be accepted or rejected.
          example: 'accepted'
        errorMessages:
          type: array
          description: List of error messages.
          items:
            $ref: '#/components/schemas/detailMessage'
        informationMessages:
          type: array
          description: List of informational messages.
          items:
            $ref: '#/components/schemas/detailMessage'      
    addendaStatusRequestEnvelope:
      required:
      - uuid
      type: object
