openapi: 3.1.0
info:
  title: Wire Inquiry
  version: 1.3.6
  description: Retrieve the status and details of a wire transaction.
  contact:
    name: KeyBank Developer Support
    email: embedded_banking_support@keybank.com
servers:
#---------------------------------------------------
# List of Environments for the API
#---------------------------------------------------
  - url: https://partner-api-qv.key.com
    description: Non-Production environment (QV)
  - url: https://partner-api.key.com
    description: Production and Simulator environment
tags:
  - name: HealthCheck
    description: Verify you can connect to the API service.
  - name: Wire
    description: Wire Inquiry functions to list wires and retrieve wire details
security:
  - bearerAuth: []
paths:
#---------------------------------------------------
# List of API flows
#---------------------------------------------------  
  /wireInquiry/v1/healthCheck:
    get:
      tags:
        - HealthCheck
      summary: Health check
      description: Verify you can connect to the API service. A bearer token is required.
      operationId: healthCheck
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          headers:
            X-CorrelationId:
              description: A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                Status: Ok
                Source: Roundtrip
                Timestamp: '2022-09-15T04:49:03'
                ClientIp: 192.0.2.1
                X-Forwarded-For: '[192.0.2.1]'
  /wireInquiry/v1/transactions/list:
    post:
      tags:
        - Wire
      summary: Search wire transfers
      operationId: searchWireTransactions
      description: Based on search criteria provided, get a list of wire transfers. The account number and date range are required for every request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNumber
                - fromDate
                - toDate
              properties:
                accountNumber:
                  type: string
                  description: The bank account number. This number cannot exceed 16
                    characters.
                  minLength: 1
                  maxLength: 16
                  pattern: ^\d+$
                  examples:
                    - '3123456789'
                fromDate:
                  type: string
                  format: date
                  description: >-
                    Start date for the date range. This date can be the current
                    day or within 180 days prior to the current date. To search
                    for a single date, this value will be the same as the
                    toDate. Format: YYYY-MM-DD
                  examples:
                    - '2024-02-01'
                toDate:
                  type: string
                  format: date
                  description: >-
                    End date for the date range. This date must be the same or
                    later than the start date (fromDate). To search for a single
                    date, this value will be the same as the fromDate.  To
                    search for a range of dates, make sure the date range does
                    not exceed 31 days. Format: YYYY-MM-DD
                  examples:
                    - '2024-02-01'
                minimumAmount:
                  allOf:
                    - $ref: '#/components/schemas/Amount0To1B'
                  description: >-
                    The minimum dollar amount of the transaction. This amount
                    must be less than or equal to the maximum amount. Leave
                    blank or enter zero for no minimum amount.
                  examples:
                    - 0.5
                    - 100
                    - 75.1
                    - 83838.23
                    - '0.50'
                    - 75,020.52
                    - '74333.22'
                maximumAmount:
                  allOf:
                    - $ref: '#/components/schemas/Amount0To1B'
                  description: >-
                    The maximum dollar amount of the transaction. This amount
                    must be greater than or equal to the minimum amount. Leave
                    blank to retrieve all amounts. This amount cannot exceed one
                    billion dollars.
                  examples:
                    - 100
                    - 75.1
                    - 83838.23
                    - 75,020.52
                    - '74333.22'
                requestReference:
                  type: string
                  description: >-
                    A reference value for the original request that is useful
                    for traceability and reporting. The ID cannot exceed 32
                    characters.
                  maxLength: 32
                  examples:
                    - '1122334455'
                pageNumber:
                  type: integer
                  format: int32
                  minimum: 1
                  description: >-
                    The number of the page being viewed. This number must be
                    greater than or equal to 1.
                  examples:
                    - 1
                pageSize:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 1000
                  description: >-
                    The number of records per page. This number must be greater
                    than or equal to 1 and cannot exceed 1000.
                  examples:
                    - 500
      responses:
        '200':
          description: Search results match the criteria
          headers:
            X-CorrelationId:
              description: >-
                A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations. The ID
                is unique to each request.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/WireListTransaction'
                  metadata:
                    $ref: '#/components/schemas/PageMetadata'
              example:
                transactions:
                  - transactionId: US99999000999999
                    transactionStatus: COMPLETED
                    transactionStatusTimestamp: '2026-01-12T12:18:01'
                    transactionDate: '2026-01-12'
                    transactionAmount: 32772.63
                    requestReference: '1122334455'
                    sendersReference: US99999000999999
                    creditor:
                      name: Global Markets LLC
                    creditorAccount:
                      accountNumber: '987654321'
                    debtor:
                      name: Paul Wilson
                    debtorAccount:
                      accountNumber: '123456789'
                    originator:
                      name: VAM TEST BANK
                    beneficiary:
                      name: MARKET CAPITAL
                metadata:
                  page:
                    pageNumber: 1
                    pageSize: 25
                    totalPages: 3
                    totalRecords: 75
                    lastPage: false
        '400':
          description: Bad input parameter
          headers:
            X-CorrelationId:
              description: >-
                A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations. The ID
                is unique to each request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
              example:
                ErrorMessage: Error received from backend service
                TransactionId: 84293235-5d2c-42ba-afc3-a5d4afc5f88e27097
                X-CorrelationId: 929618f2-6163-bf73-51b0-6c54a8533c74
                TransactionTime: '2021-06-11T16:31:34.041Z'
                Api-Url: >-
                  https://partner-api-qv.key.com/wireInquiry/v1/transactions/list
                ServiceError:
                  metadata:
                    messages:
                      - code: Wire-List-400-toDate
                        message: toDate format must be YYYY-MM-DD
        '401':
          description: Unauthorized request
          headers:
            X-CorrelationId:
              description: >-
                A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
              example:
                ErrorMessage: >-
                  Received request is unauthorized, please provide valid
                  credentials
                TransactionId: 0635f201-8fbb-418f-b93a-138d5103e2b91348
                X-CorrelationId: 929618f2-6163-bf73-51b0-6c54a8533c74
                TransactionTime: '2021-06-11T16:31:34.041Z'
                Api-Url: >-
                  https://partner-api-qv.key.com/wireInquiry/v1/transactions/list
        '403':
          description: Entitlements validation failed
          headers:
            X-CorrelationId:
              description: >-
                A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
              example:
                ErrorMessage: Error received from backend service
                TransactionId: 84293235-5d2c-42ba-afc3-a5d4afc5f88e27097
                X-CorrelationId: 929618f2-6163-bf73-51b0-6c54a8533c74
                TransactionTime: '2021-06-11T16:31:34.041Z'
                Api-Url: >-
                  https://partner-api-qv.key.com/wireInquiry/v1/transactions/list
                ServiceError:
                  metadata:
                    messages:
                      - code: 403-Forbidden
                        message: Entitlements Validation Failed
        '408':
          description: Request timeout error
          headers:
            X-CorrelationId:
              description: >-
                A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
              example:
                ErrorMessage: Error received from backend service
                TransactionId: 84293235-5d2c-42ba-afc3-a5d4afc5f88e27097
                X-CorrelationId: 929618f2-6163-bf73-51b0-6c54a8533c74
                TransactionTime: '2021-06-11T16:31:34.041Z'
                Api-Url: >-
                  https://partner-api-qv.key.com/wireInquiry/v1/transactions/list
                ServiceError:
                  metadata:
                    messages:
                      - code: Wire-List-408-timeout
                        message: >-
                          The request exceeded the timeout limit.  Please adjust
                          your request parameters and try again.
        '500':
          description: Unexpected server error
          headers:
            X-CorrelationId:
              schema:
                type: string
              description: >-
                A unique identifier generated for each transaction that remains
                with the transaction through the chain of API operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
              example:
                ErrorMessage: Error received from backend
                TransactionId: 84293235-5d2c-42ba-afc3-a5d4afc5f88e27097
                TransactionTime: '2021-06-11T16:31:34.041Z'
                X-CorrelationId: 929618f2-6163-bf73-51b0-6c54a8533c74
                Api-Url: >-
                  https://partner-api-qv.key.com/wireInquiry/v1/transactions/list
                ServiceError:
                  metadata:
                    messages:
                      - code: 500-InternalServerError
                        message: >-
                          An unexpected error occurred.  Please try again later
                          or contact support if the problem persists.
  /wireInquiry/v1/transactions/detail/{transactionId}:
    get:
      tags:
        - Wire
      summary: View the details of a wire transfer by the transaction ID
      operationId: searchWireTransaction
      description: >-
        Provide the transaction ID to retrieve all available fields for that
        wire transfer.
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          description: The unique ID number associated with the original payment request.
          schema:
            maxLength: 100
            type: string
          example: US99999000999999
      responses:
        '200':
          description: A Wire transaction matches the provided transactionId
