aid: keycorp
name: KeyCorp
kind: company
type: Index
description: >-
  KeyCorp (KeyBank) is one of the nation's largest bank-based financial services
  companies and a super-regional commercial bank headquartered in Cleveland,
  Ohio, providing deposit, lending, cash management, treasury, and investment
  services to individuals, small businesses, and middle-market companies. The
  KeyBank Developer Portal at developer.key.com publishes a self-service catalog
  of commercial and embedded-banking APIs covering account information reporting,
  ACH origination, RTP and wire payments, account validation, ACH/wire/RTP
  inquiry, check services, and payment event webhooks. Each product ships a
  downloadable OpenAPI 3.1 definition and is secured with OAuth2 bearer tokens,
  mutual TLS client certificates, and FAPI-style interaction-id headers.
