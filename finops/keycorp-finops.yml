principles:
  - name: Visibility
    description: Pull KeyBank's monthly account-analysis statement (AFP service codes) and reconcile against
      API-driven payment volume from your treasury-management system.
  - name: Allocation
    description: Tag originated payments with internal cost-center metadata so per-business-unit ACH/Wire/RTP
      activity can be attributed.
  - name: Optimization
    description: Route low-urgency disbursements through ACH instead of Wire/RTP; use Account Validation
      to reduce return/repair fees.
  - name: Accountability
    description: Treasury and AP owners review the monthly bank-fee analysis statement, dispute exceptions,
      and negotiate the next contract cycle on actual API/transaction volume.
